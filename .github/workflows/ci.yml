name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also validates the checksum of the committed gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint and build debug APK
        run: ./gradlew --no-daemon lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: tilecam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
