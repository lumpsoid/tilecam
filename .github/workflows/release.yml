name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.TILECAM_KEYSTORE_BASE64 }}
          TILECAM_KEYSTORE_PASSWORD: ${{ secrets.TILECAM_KEYSTORE_PASSWORD }}
          TILECAM_KEY_ALIAS: ${{ secrets.TILECAM_KEY_ALIAS }}
          TILECAM_KEY_PASSWORD: ${{ secrets.TILECAM_KEY_PASSWORD }}
        run: |
          export TILECAM_KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$TILECAM_KEYSTORE"
          else
            # No signing secrets yet: sign with a throwaway key so the APK installs for testing.
            # Builds signed this way can't be updated in place by later releases.
            echo "::warning::Signing secrets missing; using a throwaway key"
            echo "THROWAWAY_KEY=1" >> "$GITHUB_ENV"
            export TILECAM_KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            export TILECAM_KEY_PASSWORD=$TILECAM_KEYSTORE_PASSWORD TILECAM_KEY_ALIAS=throwaway
            keytool -genkeypair -noprompt -keystore "$TILECAM_KEYSTORE" -storetype PKCS12 -alias throwaway \
              -keyalg RSA -keysize 2048 -validity 365 -dname "CN=TileCam test build" \
              -storepass "$TILECAM_KEYSTORE_PASSWORD" -keypass "$TILECAM_KEY_PASSWORD"
          fi
          ./gradlew --no-daemon assembleRelease
          rm -f "$TILECAM_KEYSTORE"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/tilecam-$VERSION.apk"
          (cd dist && sha256sum "tilecam-$VERSION.apk" > "tilecam-$VERSION.apk.sha256")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=""
          if [ -n "$THROWAWAY_KEY" ]; then
            notes="Test build signed with a throwaway key: uninstall it before installing a later release."
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "TileCam $VERSION" --notes "$notes" --generate-notes --prerelease
